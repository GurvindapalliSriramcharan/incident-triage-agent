services:
  - type: web
    name: incident-triage-agent
    env: docker
    dockerfilePath: Dockerfile
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_EMBEDDING_MODEL
        value: models/gemini-embedding-001
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
